<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Design mockup for reference only. Not app code. -->
<title>Casa Del Cocktail: Stock your cart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Righteous&amp;display=swap">
<style>
body{margin:0;background:#E9DDC3;display:flex;justify-content:center;padding:24px 0}
a{color:#A0570F}a:hover{color:#7A420B}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F5ECD7; color: #3B2A1E; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 24px 36px;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <a href="onboarding-1-welcome.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <a href="home.html" style="min-height: 44px; padding: 0 6px; display: flex; align-items: center; font-size: 15px; font-weight: 500;">Skip</a>
  </div>

  <div aria-hidden="true" style="position: relative; height: 340px; margin-top: 8px; display: flex; align-items: center; justify-content: center;">
    <div style="position: absolute; width: 310px; height: 270px; background: #E3B23C; opacity: 0.45; border-radius: 45% 55% 60% 40% / 50% 45% 55% 50%;"></div>
    <div style="position: relative; width: 292px; background: #FBF6EA; border-radius: 20px; padding: 6px 16px; box-shadow: 0 8px 24px rgba(59,42,30,0.16); display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; border-bottom: 1px solid #EFE4CC;">
        <span style="flex-grow: 1; font-family: 'Righteous', system-ui, sans-serif; font-size: 16px;">Tequila &amp; mezcal</span>
        <span style="font-size: 12px; color: #6E5A47;">2 bottles</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; border-bottom: 1px solid #F3EAD6;">
        <div style="display: flex; flex-direction: column;"><span style="font-weight: 500; font-size: 15px;">Espolòn Blanco</span><span style="font-size: 12px; color: #6E5A47;">Blanco tequila</span></div>
        <span style="border-radius: 999px; padding: 5px 13px; background: #E3B23C; color: #3B2A1E; font-size: 13px; font-weight: 500;">Full</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px;">
        <div style="display: flex; flex-direction: column;"><span style="font-weight: 500; font-size: 15px;">Casamigos Reposado</span><span style="font-size: 12px; color: #6E5A47;">Reposado tequila</span></div>
        <span style="border: 1.5px solid #A8442A; border-radius: 999px; padding: 4px 12px; background: #FBF6EA; color: #A8442A; font-size: 13px; font-weight: 500;">Low · refill</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 28px;">
    <h1 style="margin: 0; font-family: 'Righteous', system-ui, sans-serif; font-weight: 400; font-size: 32px; line-height: 1.1;">Stock your cart</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.5;">Add the bottles on your shelf. Name them if you like, and tap the level when one starts running low.</p>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 18px;">
    <div role="img" aria-label="Step 2 of 4" style="display: flex; gap: 8px; justify-content: center;">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #D8C9A8;"></span>
      <span style="width: 24px; height: 8px; border-radius: 999px; background: #A0570F;"></span>
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #D8C9A8;"></span>
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #D8C9A8;"></span>
    </div>
    <a href="onboarding-3-make-now.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 999px; background: #A0570F; color: #FBF6EA; text-decoration: none; font-size: 17px; font-weight: 700;">Next</a>
  </div>

</html>
