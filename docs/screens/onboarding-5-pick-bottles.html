<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Design mockup for reference only. Not app code. -->
<title>Casa Del Cocktail: Stock my cart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Righteous&amp;display=swap">
<style>
body{margin:0;background:#E9DDC3;display:flex;justify-content:center;padding:24px 0}
a{color:#A0570F}a:hover{color:#7A420B}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
details[open]>summary .chev{transform:rotate(180deg)}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F5ECD7; color: #3B2A1E; font-family: 'DM Sans', system-ui, sans-serif;">
  <div aria-hidden="true" style="position: absolute; top: -80px; right: -70px; width: 240px; height: 190px; background: #E3B23C; opacity: 0.45; border-radius: 62% 38% 55% 45% / 55% 50% 50% 45%;"></div>

  <div style="position: relative; padding: 20px 20px 150px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <a href="onboarding-4-unlock.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <a href="home.html" style="min-height: 44px; padding: 0 6px; display: flex; align-items: center; font-size: 15px; font-weight: 500;">Skip</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-family: 'Righteous', system-ui, sans-serif; font-weight: 400; font-size: 30px; line-height: 1.1;">What's on your cart?</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #6E5A47;">Tap everything you've got. You can add bottle names and more later.</p>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; background: #FBF6EA; border-radius: 12px; padding: 0 14px; min-height: 48px; box-shadow: inset 0 0 0 1.5px #E5D7B8;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E5A47" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search for an ingredient</span>
      <input type="search" placeholder="Looking for something else?" style="flex-grow: 1; border: 0; background: transparent; font: 400 16px 'DM Sans', sans-serif; color: #3B2A1E; outline: none; min-width: 0;">
    </label>

    <details open style="display: block;">
      <summary style="display: flex; align-items: center; justify-content: space-between; min-height: 40px;">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #6E5A47;">SPIRITS · 4 PICKED</span>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E5A47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div role="group" aria-label="Spirits" style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px;">
        <button aria-pressed="true" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #5A6B22; background: #5A6B22; color: #FBF6EA; font: 500 14px 'DM Sans', sans-serif;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Bourbon</button>
        <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #D8C9A8; background: #FBF6EA; color: #3B2A1E; font: 500 14px 'DM Sans', sans-serif;">Rye whiskey</button>
        <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #D8C9A8; background: #FBF6EA; color: #3B2A1E; font: 500 14px 'DM Sans', sans-serif;">Scotch</button>
        <button aria-pressed="true" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #5A6B22; background: #5A6B22; color: #FBF6EA; font: 500 14px 'DM Sans', sans-serif;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>London dry gin</button>
        <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #D8C9A8; background: #FBF6EA; color: #3B2A1E; font: 500 14px 'DM Sans', sans-serif;">Vodka</button>
        <button aria-pressed="true" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #5A6B22; background: #5A6B22; color: #FBF6EA; font: 500 14px 'DM Sans', sans-serif;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Blanco tequila</button>
        <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #D8C9A8; background: #FBF6EA; color: #3B2A1E; font: 500 14px 'DM Sans', sans-serif;">Mezcal</button>
        <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #D8C9A8; background: #FBF6EA; color: #3B2A1E; font: 500 14px 'DM Sans', sans-serif;">White rum</button>
        <button aria-pressed="true" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #5A6B22; background: #5A6B22; color: #FBF6EA; font: 500 14px 'DM Sans', sans-serif;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Aged rum</button>
        <button style="min-height: 40px; padding: 0 12px; border: 0; background: transparent; color: #A0570F; font: 500 14px 'DM Sans', sans-serif;">More spirits</button>
      </div>
    </details>

    <details open style="display: block;">
      <summary style="display: flex; align-items: center; justify-content: space-between; min-height: 40px;">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #6E5A47;">LIQUEURS &amp; VERMOUTH · 2 PICKED</span>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E5A47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div role="group" aria-label="Liqueurs and vermouth" style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px;">
        <button aria-pressed="true" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #5A6B22; background: #5A6B22; color: #FBF6EA; font: 500 14px 'DM Sans', sans-serif;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Triple sec</button>
        <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #D8C9A8; background: #FBF6EA; color: #3B2A1E; font: 500 14px 'DM Sans', sans-serif;">Campari</button>
        <button aria-pressed="true" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #5A6B22; background: #5A6B22; color: #FBF6EA; font: 500 14px 'DM Sans', sans-serif;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Sweet vermouth</button>
        <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #D8C9A8; background: #FBF6EA; color: #3B2A1E; font: 500 14px 'DM Sans', sans-serif;">Dry vermouth</button>
        <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #D8C9A8; background: #FBF6EA; color: #3B2A1E; font: 500 14px 'DM Sans', sans-serif;">Maraschino</button>
      </div>
    </details>

    <details style="display: block;">
      <summary style="display: flex; align-items: center; justify-content: space-between; min-height: 40px;">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #6E5A47;">BITTERS</span>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E5A47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
    </details>
    <details style="display: block;">
      <summary style="display: flex; align-items: center; justify-content: space-between; min-height: 40px;">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #6E5A47;">JUICES, SYRUPS &amp; MIXERS</span>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E5A47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
    </details>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FBF6EA; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 16px rgba(59,42,30,0.10); padding: 14px 20px 26px; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 14px; color: #6E5A47; text-align: center;">6 picked. They'll go on as Full.</span>
    <a href="home.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #A0570F; color: #FBF6EA; text-decoration: none; font-size: 16px; font-weight: 700;">Add 6 bottles and start</a>
  </div>
</div>
</body>
</html>
