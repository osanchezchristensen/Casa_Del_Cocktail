<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Design mockup for reference only. Not app code. -->
<title>Casa Del Cocktail: Add items</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Righteous&amp;display=swap">
<style>
body{margin:0;background:#E9DDC3;display:flex;justify-content:center;padding:24px 0}
a{color:#A0570F}a:hover{color:#7A420B}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #8C7A66; color: #3B2A1E; font-family: 'DM Sans', system-ui, sans-serif;">
  <div style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; background: #F5ECD7; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 24px rgba(59,42,30,0.25); display: flex; flex-direction: column;">
    <div aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: #D8C9A8; margin-top: 10px;"></div>

    <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h1 style="margin: 0; font-family: 'Righteous', system-ui, sans-serif; font-weight: 400; font-size: 26px;">Add items</h1>
        <a href="bar-cart.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; background: #FBF6EA; color: #3B2A1E; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(59,42,30,0.10);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </a>
      </div>

      <div role="tablist" aria-label="How to add" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #EADCBF; border-radius: 999px; padding: 4px;">
        <button role="tab" aria-selected="true" style="border: 0; border-radius: 999px; min-height: 40px; background: #FBF6EA; color: #3B2A1E; font: 700 15px 'DM Sans', sans-serif; box-shadow: 0 1px 4px rgba(59,42,30,0.12);">Search</button>
        <button role="tab" aria-selected="false" style="border: 0; border-radius: 999px; min-height: 40px; background: transparent; color: #6E5A47; font: 500 15px 'DM Sans', sans-serif;">Browse by category</button>
      </div>

      <label style="display: flex; align-items: center; gap: 10px; background: #FBF6EA; border-radius: 12px; padding: 0 14px; min-height: 48px; box-shadow: inset 0 0 0 2px #A0570F;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E5A47" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search ingredients</span>
        <input type="search" value="tequila" style="flex-grow: 1; border: 0; background: transparent; font: 400 16px 'DM Sans', sans-serif; color: #3B2A1E; outline: none; min-width: 0;">
      </label>

      <div style="background: #FBF6EA; border-radius: 20px; padding: 2px 16px; box-shadow: 0 2px 10px rgba(59,42,30,0.08); display: flex; flex-direction: column;">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-bottom: 1px solid #EFE4CC;">
          <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #5A6B22; margin: 0;">
          <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-weight: 500;">Blanco tequila</span><span style="font-size: 13px; color: #6E5A47;">You have 1: Espolòn Blanco</span></span>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-bottom: 1px solid #EFE4CC;">
          <input type="checkbox" style="width: 22px; height: 22px; accent-color: #5A6B22; margin: 0;">
          <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-weight: 500;">Reposado tequila</span><span style="font-size: 13px; color: #6E5A47;">You have 1: Casamigos Reposado</span></span>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-bottom: 1px solid #EFE4CC;">
          <input type="checkbox" style="width: 22px; height: 22px; accent-color: #5A6B22; margin: 0;">
          <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-weight: 500;">Añejo tequila</span><span style="font-size: 13px; color: #6E5A47;">Spirit</span></span>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 50px;">
          <input type="checkbox" style="width: 22px; height: 22px; accent-color: #5A6B22; margin: 0;">
          <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-weight: 500;">Tequila</span><span style="font-size: 13px; color: #6E5A47;">Not sure which kind</span></span>
        </label>
      </div>
    </div>

    <div style="margin-top: auto; background: #FBF6EA; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 16px rgba(59,42,30,0.10); padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: 'Righteous', system-ui, sans-serif; font-size: 20px;">Add these 2 bottles?</span>
        <span style="font-size: 13px; color: #6E5A47; line-height: 1.35;">Name the bottle if you like. Recipes only care about the type.</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label for="bottle-1" style="font-size: 14px; font-weight: 700;">Blanco tequila</label>
        <input id="bottle-1" type="text" value="Jose Cuervo Especial Silver" style="min-height: 44px; border: 0; border-radius: 12px; padding: 0 12px; background: #F5ECD7; box-shadow: inset 0 0 0 1.5px #E5D7B8; font: 400 15px 'DM Sans', sans-serif; color: #3B2A1E;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label for="bottle-2" style="font-size: 14px; font-weight: 700;">Ginger beer</label>
        <input id="bottle-2" type="text" placeholder="Bottle name (optional)" style="min-height: 44px; border: 0; border-radius: 12px; padding: 0 12px; background: #F5ECD7; box-shadow: inset 0 0 0 1.5px #E5D7B8; font: 400 15px 'DM Sans', sans-serif; color: #3B2A1E;">
      </div>

      <a href="bar-cart.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #A0570F; color: #FBF6EA; text-decoration: none; font-size: 16px; font-weight: 700;">Add 2 bottles to my cart</a>
    </div>
  </div>
</div>
</body>
</html>
