<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Design mockup for reference only. Not app code. -->
<title>Casa Del Cocktail: Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Righteous&amp;display=swap">
<style>
body{margin:0;background:#E9DDC3;display:flex;justify-content:center;padding:24px 0}
a{color:#A0570F}a:hover{color:#7A420B}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F5ECD7; color: #3B2A1E; font-family: 'DM Sans', system-ui, sans-serif;">
  <div aria-hidden="true" style="position: absolute; top: -70px; right: -90px; width: 300px; height: 230px; background: #E3B23C; opacity: 0.5; border-radius: 62% 38% 55% 45% / 55% 50% 50% 45%;"></div>
  <div aria-hidden="true" style="position: absolute; top: 30px; right: 40px; width: 110px; height: 90px; background: #D98E2B; opacity: 0.55; border-radius: 50% 50% 40% 60% / 60% 40% 60% 40%;"></div>

  <div style="position: relative; padding: 24px 20px 110px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-family: 'Righteous', system-ui, sans-serif; font-size: 20px;">Casa Del Cocktail</span>
      <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #FBF6EA; color: #3B2A1E; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(59,42,30,0.10);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"></path><path d="M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg>
      </button>
    </div>

    <h1 style="margin: 18px 0 0; font-family: 'Righteous', system-ui, sans-serif; font-weight: 400; font-size: 32px; line-height: 1.1;">Welcome back<br>to Casa.</h1>

    <a href="make-now.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #D98E2B; color: #3B2A1E; text-decoration: none; border-radius: 24px; padding: 20px 22px; box-shadow: 0 4px 14px rgba(160,87,15,0.25);">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 500;">You can make</span>
        <span style="font-family: 'Righteous', system-ui, sans-serif; font-size: 56px; line-height: 1;">14</span>
        <span style="font-size: 15px; font-weight: 500;">cocktails tonight</span>
      </div>
      <span style="width: 48px; height: 48px; border-radius: 50%; background: #FBF6EA; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B2A1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
      </span>
    </a>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <a href="bar-cart.html" style="background: #FBF6EA; border-radius: 20px; padding: 16px; text-decoration: none; color: #3B2A1E; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 2px 10px rgba(59,42,30,0.08);">
        <span style="font-family: 'Righteous', system-ui, sans-serif; font-size: 28px; color: #A8442A;">2</span>
        <span style="font-size: 14px; line-height: 1.3;">bottles running low</span>
        <span style="font-size: 13px; color: #6E5A47;">Rye, sweet vermouth</span>
      </a>
      <a href="favorites.html" style="background: #FBF6EA; border-radius: 20px; padding: 16px; text-decoration: none; color: #3B2A1E; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 2px 10px rgba(59,42,30,0.08);">
        <span style="font-family: 'Righteous', system-ui, sans-serif; font-size: 28px; color: #5A6B22;">3</span>
        <span style="font-size: 14px; line-height: 1.3;">favorites ready to make</span>
        <span style="font-size: 13px; color: #6E5A47;">See your list</span>
      </a>
    </div>

    <div style="background: #FBF6EA; border-radius: 20px; padding: 18px; display: flex; gap: 16px; align-items: center; box-shadow: 0 2px 10px rgba(59,42,30,0.08);">
      <span style="flex-shrink: 0; width: 64px; height: 64px; border-radius: 50% 50% 46% 54% / 55% 45% 55% 45%; background: #E3B23C; display: flex; align-items: center; justify-content: center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3B2A1E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14l-1.5 14h-11z"></path><path d="M6 11h12"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
        <span style="font-size: 13px; font-weight: 700; color: #6E5A47; letter-spacing: 0.04em;">TONIGHT'S PICK</span>
        <span style="font-family: 'Righteous', system-ui, sans-serif; font-size: 20px;">Old Fashioned</span>
        <a href="recipe-detail.html" style="font-size: 14px; font-weight: 500;">See the recipe</a>
      </div>
    </div>

    <p style="margin: 6px 0 0; font-size: 13px; color: #6E5A47; text-align: center;">Made for enjoying, not overdoing. Please drink responsibly.</p>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FBF6EA; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 16px rgba(59,42,30,0.08); display: flex; align-items: flex-start; justify-content: space-around; padding: 10px 6px 0; box-sizing: border-box;">
    <a href="bar-cart.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E5A47; font-size: 12px; font-weight: 500;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 22h8"></path><path d="M7 10h10"></path><path d="M12 15v7"></path><path d="M12 15a5 5 0 0 0 5-5c0-2-.5-4-2-8H9c-1.5 4-2 6-2 8a5 5 0 0 0 5 5Z"></path></svg>
      Bar Cart
    </a>
    <a href="make-now.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E5A47; font-size: 12px; font-weight: 500;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 22h8"></path><path d="M12 11v11"></path><path d="m19 3-7 8-7-8Z"></path></svg>
      Make Now
    </a>
    
    <a href="home.html" aria-label="Home" aria-current="page" style="width: 52px; height: 52px; margin-top: -2px; border-radius: 50%; background: #D98E2B; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #3B2A1E; box-shadow: 0 3px 10px rgba(160,87,15,0.30);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
    </a><a href="unlock.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E5A47; font-size: 12px; font-weight: 500;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
      Unlock
    </a>
    <a href="favorites.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E5A47; font-size: 12px; font-weight: 500;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
      Favorites
    </a>
  </nav>
</div>
</body>
</html>
